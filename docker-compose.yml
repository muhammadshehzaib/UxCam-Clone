version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uxclone-postgres
    environment:
      POSTGRES_DB: uxclone
      POSTGRES_USER: uxclone
      POSTGRES_PASSWORD: uxclone
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uxclone']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uxclone-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Self-hosted S3-compatible object storage for replay blobs (web DOM recordings).
  # Host ports 9100/9101 — 9000 is reserved on this machine, so we don't publish it.
  minio:
    image: minio/minio:latest
    container_name: uxclone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-uxclone}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-uxclone-minio-secret}
    ports:
      - '9100:9000'   # S3 API
      - '9101:9001'   # web console (file-explorer UI)
    volumes:
      - minio_data:/data

  api:
    build:
      # Root context so the image can also build the browser SDK bundle from sdk/.
      context: .
      dockerfile: backend/Dockerfile
    container_name: uxclone-api
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uxclone-dashboard
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - '3009:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
